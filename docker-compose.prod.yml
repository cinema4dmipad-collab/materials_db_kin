# Прод / внешний сервер (Dokploy и т.п.):
# Postgres и S3 уже развёрнуты отдельно — поднимаем только приложение.
#
# Dokploy:
#   Add Service → Docker Compose
#   Compose file: docker-compose.prod.yml
#   Environment: WEB_IMAGE, DB_*, AWS_* (см. .env.prod.example)
#   Domain → nginx:80
#
# Переменные DB_* и AWS_* задаются в .env (см. .env.prod.example).

configs:
  nginx_default_conf:
    file: ./deploy/nginx/nginx.conf

services:
  web:
    image: ${WEB_IMAGE}
    env_file: .env
    environment:
      DB_ENGINE: postgresql
    volumes:
      - staticfiles:/app/staticfiles
    expose:
      - '8000'
    restart: unless-stopped
    networks:
      - dokploy-network

  nginx:
    image: nginx:1.27-alpine
    configs:
      - source: nginx_default_conf
        target: /etc/nginx/conf.d/default.conf
    volumes:
      - staticfiles:/var/www/static:ro
    depends_on:
      - web
    expose:
      - '80'
    restart: unless-stopped
    networks:
      - dokploy-network

volumes:
  staticfiles:

networks:
  dokploy-network:
    external: true
