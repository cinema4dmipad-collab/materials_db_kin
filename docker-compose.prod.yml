# Прод / внешний сервер (Dokploy и т.п.):
# Postgres и S3 уже развёрнуты отдельно — поднимаем только приложение.
#
# Запуск:
#   docker compose -f docker-compose.prod.yml up -d
#
# Dokploy:
#   Add Service → Docker Compose → compose file: docker-compose.prod.yml
#   Domain → nginx:80 (Traefik уже слушает :80 на хосте)
#   Подключите сервисы к сети dokploy-network (см. networks ниже).
#
# Переменные DB_* и AWS_* задаются в .env (см. .env.prod.example).

configs:
  nginx_default_conf:
    file: ./deploy/nginx/nginx.conf

services:
  web:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    env_file: .env
    environment:
      DB_ENGINE: postgresql
    volumes:
      - staticfiles:/app/staticfiles
    expose:
      - '8000'
    restart: unless-stopped
    networks:
      - dokploy-network

  nginx:
    image: nginx:1.27-alpine
    configs:
      - source: nginx_default_conf
        target: /etc/nginx/conf.d/default.conf
    volumes:
      - staticfiles:/var/www/static:ro
    depends_on:
      - web
    expose:
      - '80'
    restart: unless-stopped
    networks:
      - dokploy-network

volumes:
  staticfiles:

networks:
  dokploy-network:
    external: true
