# Прод / Dokploy (Docker Compose mode, не Stack):
# Postgres и S3 — отдельные сервисы в том же проекте Dokploy.
#
# Настройка:
#   Add Service → Docker Compose
#   Compose file: docker-compose.prod.yml
#   Compose Type: Docker Compose (не Stack)
#   Environment: DB_* + AWS_* (см. .env.prod.example)
#   Domain → nginx:80
#
# Образы собираются на сервере из Dockerfile (pull_policy: build).
# Hash коммита для /debug/ (BUILD_COMMIT в образе) — при стандартном деплое Dokploy.
# Command в UI Dokploy: ОСТАВИТЬ ПУСТЫМ (не sh deploy/dokploy-deploy.sh — см. deploy/DOKPLOY.md).
# GIT_COMMIT в runtime .env не нужен.
# WEB_IMAGE / NGINX_IMAGE — локальные теги после сборки, НЕ пути Docker Hub.
# Для registry укажите полный URL, например:
#   WEB_IMAGE=registry.gitlab.keeneticcorp.ru/.../materials_db_strict:abc1234
# и настройте docker login в Dokploy.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.13-slim-bookworm}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
        PIP_MIRROR_URLS: ${PIP_MIRROR_URLS:-}
        GIT_COMMIT: ${GIT_COMMIT:-}
        CI_COMMIT_SHORT_SHA: ${CI_COMMIT_SHORT_SHA:-}
        DOKPLOY_COMMIT_HASH: ${DOKPLOY_COMMIT_HASH:-}
        SOURCE_COMMIT: ${SOURCE_COMMIT:-}
        BUILD_CACHE_BUST: ${BUILD_CACHE_BUST:-1}
    image: ${WEB_IMAGE:-materials-db-web:prod}
    pull_policy: build
    env_file: .env
    environment:
      DB_ENGINE: postgresql
      BACKUP_DIR: /backups
    volumes:
      - staticfiles:/app/staticfiles
      - backups:/backups
    expose:
      - '8000'
    restart: unless-stopped

  backup-cron:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.13-slim-bookworm}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
        PIP_MIRROR_URLS: ${PIP_MIRROR_URLS:-}
        GIT_COMMIT: ${GIT_COMMIT:-}
        CI_COMMIT_SHORT_SHA: ${CI_COMMIT_SHORT_SHA:-}
        DOKPLOY_COMMIT_HASH: ${DOKPLOY_COMMIT_HASH:-}
        SOURCE_COMMIT: ${SOURCE_COMMIT:-}
        BUILD_CACHE_BUST: ${BUILD_CACHE_BUST:-1}
    image: ${WEB_IMAGE:-materials-db-web:prod}
    pull_policy: build
    env_file: .env
    environment:
      DB_ENGINE: postgresql
      BACKUP_DIR: /backups
    volumes:
      - backups:/backups
    depends_on:
      - web
    entrypoint: ['/bin/sh', '-c']
    command: ['while true; do python manage.py run_scheduled_backup || true; sleep 60; done']
    restart: unless-stopped

  nginx:
    build:
      context: ./deploy/nginx
      dockerfile: Dockerfile
    image: ${NGINX_IMAGE:-materials-db-nginx:prod}
    pull_policy: build
    volumes:
      - staticfiles:/var/www/static:ro
    depends_on:
      - web
    expose:
      - '80'
    restart: unless-stopped

volumes:
  staticfiles:
  backups:

networks:
  default:
    name: dokploy-network
    external: true
