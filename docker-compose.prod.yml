# Прод / Dokploy (Docker Compose mode, не Stack):
# Postgres и S3 — отдельные сервисы в том же проекте Dokploy.
#
# Настройка:
#   Add Service → Docker Compose
#   Compose file: docker-compose.prod.yml
#   Compose Type: Docker Compose (не Stack — нужен build для nginx)
#   Environment: WEB_IMAGE + DB_* + AWS_* (см. .env.prod.example)
#   Domain → nginx:80
#
# Важно: отключите Auto Deploy на старом Application (djangoapp),
# иначе каждый push будет пытаться пересобрать его отдельно.

services:
  web:
    image: ${WEB_IMAGE}
    env_file: .env
    environment:
      DB_ENGINE: postgresql
    volumes:
      - staticfiles:/app/staticfiles
    expose:
      - '8000'
    restart: unless-stopped

  nginx:
    build:
      context: ./deploy/nginx
      dockerfile: Dockerfile
    image: materials-db-nginx:prod
    volumes:
      - staticfiles:/var/www/static:ro
    depends_on:
      - web
    expose:
      - '80'
    restart: unless-stopped

volumes:
  staticfiles:

networks:
  default:
    name: dokploy-network
    external: true
