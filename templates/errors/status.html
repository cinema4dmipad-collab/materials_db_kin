{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ status_code }} {{ error_title }} — База композитов</title>
    <link rel="icon" href="{% static 'img/keenetica-lab-logo-h100.png' %}?v={{ app_version }}-lab7" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/keenetica-theme.css' %}?v={{ app_version }}-lab17" rel="stylesheet">
</head>
<body class="app-body--guest">
    <header class="app-topbar navbar navbar-dark navbar-keenetica">
        <div class="container-fluid app-topbar__inner">
            <a class="navbar-brand app-topbar__brand" href="{% url 'core:dashboard' %}" aria-label="Keenetica Lab — на главную">
                <img src="{% static 'img/keenetica-lab-logo-h50.png' %}?v={{ app_version }}-lab7"
                     srcset="{% static 'img/keenetica-lab-logo-h50.png' %}?v={{ app_version }}-lab7 1x,
                             {% static 'img/keenetica-lab-logo-h100.png' %}?v={{ app_version }}-lab7 2x"
                     alt="KEENETICA LAB"
                     class="brand-logo"
                     width="269"
                     height="32">
            </a>
        </div>
    </header>
    <div class="app-main app-main--guest">
        <main class="container-fluid">
            <div class="http-error">
                <div class="card http-error__card">
                    <div class="card-body text-center p-4 p-md-5">
                        <p class="http-error__code mb-2">{{ status_code }}</p>
                        <h1 class="h4 mb-3">{{ error_title }}</h1>
                        <p class="text-muted mb-4">{{ error_message }}</p>
                        <div class="d-flex flex-wrap justify-content-center gap-2">
                            <a href="{% url 'core:dashboard' %}" class="btn btn-primary">На главную</a>
                            <a href="{% url 'core:help' %}" class="btn btn-outline-secondary">Справка</a>
                            {% if not is_authenticated %}
                            <a href="{% url 'accounts:login' %}" class="btn btn-outline-secondary">Войти</a>
                            {% endif %}
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
