{% extends 'base.html' %}

{% block title %}Удаление скана{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white">
                <h1 class="h5 mb-0">Удаление скана</h1>
            </div>
            <div class="card-body">
                <p>Удалить скан <strong>{{ scan.title }}</strong> и файл из хранилища?</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger">Удалить</button>
                        <a href="{% url 'scans:list' sample.pk %}" class="btn btn-outline-secondary">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
