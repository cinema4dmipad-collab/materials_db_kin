<footer class="app-footer app-footer--compact{% if in_shell %} app-footer--in-shell{% endif %}">
    <div class="container-fluid app-footer__compact-inner">
        <div class="app-footer__compact-left">
            <span class="app-footer__brand-mark">KEENETICA</span>
            <span class="app-footer__sep" aria-hidden="true">·</span>
            <span class="app-footer__version">База композитов v{{ app_version }}</span>
        </div>
        <div class="app-footer__compact-right">
            <a href="mailto:info@keenetica.ru">info@keenetica.ru</a>
            <a href="https://keenetica.ru/" target="_blank" rel="noopener noreferrer">keenetica.ru</a>
            <span class="app-footer__sep d-none d-sm-inline" aria-hidden="true">·</span>
            <span class="app-footer__copy d-none d-sm-inline">© ООО «КИНЕТИКА»</span>
        </div>
    </div>
</footer>
