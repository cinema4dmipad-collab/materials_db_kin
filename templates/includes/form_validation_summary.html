{% if form_validation_summary %}
<div class="alert alert-danger mb-4" role="alert">
    <div class="fw-semibold mb-2">Исправьте ошибки перед сохранением:</div>
    <ul class="mb-0 ps-3">
        {% for item in form_validation_summary %}
        <li><span class="text-muted">{{ item.section }}:</span> {{ item.message }}</li>
        {% endfor %}
    </ul>
</div>
{% endif %}
