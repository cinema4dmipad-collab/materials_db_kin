{% if add_url %}
<a href="{{ add_url }}"
   class="attachments-add-fab"
   data-attachments-add-fab
   aria-hidden="true"
   tabindex="-1"
   title="{{ add_label|default:'Добавить файл' }}">
    <span class="attachments-add-fab__icon" aria-hidden="true"><i class="bi bi-plus-lg"></i></span>
    <span class="attachments-add-fab__label">Добавить</span>
</a>
{% endif %}
