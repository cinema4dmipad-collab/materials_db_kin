<div class="inline-search-panel">
    <label class="inline-search-panel__label" for="table-search-{{ table_id }}">Быстрый поиск в таблице</label>
    <div class="search-input-wrap">
        {% include 'includes/search_input_icon.html' %}
        <input type="search"
               id="table-search-{{ table_id }}"
               class="form-control search-input-field"
               placeholder="{{ placeholder|default:'Начните вводить для фильтрации строк...' }}"
               data-table-search="{{ table_id }}"
               autocomplete="off"
               aria-label="{{ placeholder|default:'Поиск в таблице' }}">
    </div>
</div>
