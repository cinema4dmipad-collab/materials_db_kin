<div class="card-search-panel">
    <div class="card-search-panel__title">Поиск по списку</div>
    <div class="search-input-wrap">
        {% include 'includes/search_input_icon.html' %}
        <input type="search"
               class="form-control search-input-field"
               placeholder="{{ placeholder|default:'Начните вводить для поиска...' }}"
               data-card-search="{{ target_selector }}"
               autocomplete="off"
               aria-label="{{ placeholder|default:'Поиск' }}">
    </div>
</div>
