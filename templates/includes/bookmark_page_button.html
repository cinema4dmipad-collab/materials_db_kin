{% if not current_page_is_stock_nav %}
<li class="nav-item">
    {% if current_url_is_bookmarked and not current_page_bookmark %}
    <button type="button"
            class="app-topbar__bookmark-btn is-bookmarked"
            id="bookmark-page-open"
            disabled
            title="Эта страница уже есть в закладках">
        <i class="bi bi-bookmark-fill" aria-hidden="true"></i>
        <span class="d-none d-md-inline">В закладках</span>
    </button>
    {% else %}
    <button type="button"
            class="app-topbar__bookmark-btn{% if current_page_bookmark %} is-bookmarked{% endif %}"
            id="bookmark-page-open"
            data-bs-toggle="modal"
            data-bs-target="#bookmarkPageModal"
            data-bookmarked="{% if current_page_bookmark %}1{% else %}0{% endif %}"
            {% if current_page_bookmark %}
            data-bookmark-label="{{ current_page_bookmark.label }}"
            data-bookmark-icon="{{ current_page_bookmark.icon|default:default_page_bookmark_icon }}"
            title="Страница уже в закладках — можно изменить название или иконку"
            {% else %}
            title="Добавить страницу в закладки"
            {% endif %}>
        {% if current_page_bookmark %}
        <i class="bi bi-bookmark-fill" aria-hidden="true"></i>
        <span class="d-none d-md-inline">В закладках</span>
        {% else %}
        <i class="bi bi-bookmark-plus" aria-hidden="true"></i>
        <span class="d-none d-md-inline">В закладки</span>
        {% endif %}
    </button>
    {% endif %}
</li>
{% endif %}
