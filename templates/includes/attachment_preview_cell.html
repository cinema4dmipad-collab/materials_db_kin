{% if is_excel %}
<span class="attachment-preview-badge attachment-preview-badge--excel" title="Excel — превью не строится">
    <i class="bi bi-file-earmark-excel" aria-hidden="true"></i>
    <span>Excel</span>
</span>
{% elif is_pending %}
<span class="attachment-preview-badge attachment-preview-badge--pending" title="Готовим миниатюру…">
    <i class="bi bi-hourglass-split" aria-hidden="true"></i>
    <span>Обработка</span>
</span>
{% elif is_failed %}
<span class="attachment-preview-badge attachment-preview-badge--failed" title="Не удалось подготовить превью">
    <i class="bi bi-exclamation-triangle" aria-hidden="true"></i>
    <span>Ошибка</span>
</span>
{% elif preview_url %}
<img class="attachment-preview-thumb"
     src="{{ preview_url }}"
     alt="Превью первой страницы"
     width="72"
     height="96"
     loading="lazy">
{% elif is_pdf or is_word %}
<span class="attachment-preview-badge" title="{{ kind_label }}">
    <i class="bi bi-file-earmark{% if is_pdf %}-pdf{% elif is_word %}-word{% endif %}" aria-hidden="true"></i>
    <span>{{ kind_label }}</span>
</span>
{% else %}
<span class="attachment-preview-badge" title="{{ kind_label }}">
    <i class="bi bi-file-earmark" aria-hidden="true"></i>
    <span>{{ kind_label }}</span>
</span>
{% endif %}
