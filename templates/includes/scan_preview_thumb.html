{% if scan.preview %}
<img src="{% url 'scans:preview' scan.sample_id scan.pk %}"
     alt="Превью {{ scan.title }}"
     class="{% if size == 'tile' %}file-tile__preview-img{% else %}scan-preview-thumb{% if size == 'lg' %} scan-preview-thumb--lg{% elif size == 'detail' %} scan-preview-thumb--detail{% endif %}{% endif %}"
     loading="lazy">
{% else %}
<span class="{% if size == 'tile' %}file-tile__preview-placeholder{% else %}scan-preview-thumb scan-preview-thumb--empty{% if size == 'lg' %} scan-preview-thumb--lg{% elif size == 'detail' %} scan-preview-thumb--detail{% endif %}{% endif %}"
      title="Превью не загружено"
      aria-hidden="true">
    <i class="bi bi-image" aria-hidden="true"></i>
    {% if size == 'tile' %}<span>Нет превью</span>{% endif %}
</span>
{% endif %}
