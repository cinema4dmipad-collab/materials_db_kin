{% if scan.preview %}
<img src="{{ scan.preview.url }}"
     alt="Превью {{ scan.title }}"
     class="scan-preview-thumb{% if size == 'lg' %} scan-preview-thumb--lg{% endif %}"
     loading="lazy">
{% else %}
<span class="scan-preview-thumb scan-preview-thumb--empty{% if size == 'lg' %} scan-preview-thumb--lg{% endif %}"
      title="Превью не загружено"
      aria-hidden="true">
    <i class="bi bi-image" aria-hidden="true"></i>
</span>
{% endif %}
