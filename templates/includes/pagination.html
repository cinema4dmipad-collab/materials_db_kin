{% if page_obj.has_other_pages %}
<nav class="mt-3" aria-label="Навигация по страницам">
    <ul class="pagination justify-content-center mb-0">
        {% if page_obj.has_previous %}
        <li class="page-item">
            <a class="page-link" href="?{% if pagination_query %}{{ pagination_query }}&{% endif %}page={{ page_obj.previous_page_number }}">Назад</a>
        </li>
        {% else %}
        <li class="page-item disabled"><span class="page-link">Назад</span></li>
        {% endif %}
        <li class="page-item disabled">
            <span class="page-link">Стр. {{ page_obj.number }} из {{ page_obj.paginator.num_pages }}</span>
        </li>
        {% if page_obj.has_next %}
        <li class="page-item">
            <a class="page-link" href="?{% if pagination_query %}{{ pagination_query }}&{% endif %}page={{ page_obj.next_page_number }}">Вперёд</a>
        </li>
        {% else %}
        <li class="page-item disabled"><span class="page-link">Вперёд</span></li>
        {% endif %}
    </ul>
</nav>
{% endif %}
