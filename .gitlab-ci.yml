# GitLab CI/CD — materials-db-v1
# Документация: https://docs.gitlab.com/ee/ci/
#
# CI/CD variables (Settings → CI/CD → Variables):
#   Для deploy (protected, только main):
#     DEPLOY_HOST      — хост сервера
#     DEPLOY_USER      — SSH-пользователь
#     DEPLOY_PATH      — каталог с docker-compose на сервере
#     SSH_PRIVATE_KEY  — приватный ключ (File/Masked)
#
# Registry: GitLab включает CI_REGISTRY_* автоматически на gitlab.com / self-managed.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - test
  - build
  - deploy

variables:
  POSTGRES_DB: materials_db_test
  POSTGRES_USER: materials
  POSTGRES_PASSWORD: ci-test-db-password
  POSTGRES_HOST_AUTH_METHOD: trust
  DB_ENGINE: postgresql
  DB_HOST: postgres
  DB_NAME: materials_db_test
  DB_USER: materials
  DB_PASSWORD: ci-test-db-password
  DB_PORT: '5432'
  DB_WAIT_TIMEOUT: '30'
  SECRET_KEY: ci-test-secret-key-not-for-production
  DEBUG: 'True'
  USE_S3: 'false'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  POETRY_NO_INTERACTION: '1'
  POETRY_VIRTUALENVS_CREATE: 'false'
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: '/certs'
  PYTHON_IMAGE: python:3.13-slim-bookworm
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  IMAGE_TAG_LATEST: $CI_REGISTRY_IMAGE:latest

default:
  interruptible: true

.poetry_setup: &poetry_setup
  - apt-get update -qq
  - apt-get install -y -qq --no-install-recommends libpq-dev gcc curl
  - rm -rf /var/lib/apt/lists/*
  - chmod +x deploy/ci/poetry_install.sh
  - ./deploy/ci/poetry_install.sh

# --- Test ---

test:
  stage: test
  image: python:3.13-slim-bookworm
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_HOST_AUTH_METHOD: trust
  before_script:
    *poetry_setup
  script:
    - python manage.py test --verbosity 1

# --- Build & push Docker image ---

build:
  stage: build
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - >
      docker build
      --build-arg PYTHON_IMAGE="$PYTHON_IMAGE"
      --build-arg PIP_INDEX_URL="${PIP_INDEX_URL:-}"
      --build-arg PIP_TRUSTED_HOST="${PIP_TRUSTED_HOST:-}"
      --build-arg PIP_MIRROR_URLS="${PIP_MIRROR_URLS:-}"
      -t "$IMAGE_TAG"
      -t "$IMAGE_TAG_LATEST"
      .
    - docker push "$IMAGE_TAG"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker push "$IMAGE_TAG_LATEST"
      fi
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        docker tag "$IMAGE_TAG" "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
        docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# --- Deploy (manual) ---

.deploy_template: &deploy_template
  stage: deploy
  image: alpine:3.21
  before_script:
    - apk add --no-cache openssh-client bash curl
    - chmod +x deploy/ci/deploy_ssh.sh
  script:
    - export DEPLOY_IMAGE="${DEPLOY_IMAGE:-$IMAGE_TAG}"
    - ./deploy/ci/deploy_ssh.sh
  when: manual
  needs:
    - job: build
      artifacts: false

deploy:staging:
  <<: *deploy_template
  environment:
    name: staging
    url: https://${DEPLOY_HOST}
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy:production:
  <<: *deploy_template
  variables:
    DEPLOY_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
  environment:
    name: production
    url: https://${DEPLOY_HOST}
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: build
      artifacts: false
